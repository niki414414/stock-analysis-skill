#
# ai_correlation 字段说明（每个子赛道必填）：
#   positive  = 与AI科技正相关，AI涨时同涨，AI跌时跟跌（半导体/光模块/PCB/机器人）
#   hybrid    = 双重属性，算电协同时共振，AI过热时接替（算电/电力设备）
#   counter   = 与AI负相关，AI吸水时被抽，AI歇脚时接棒（高股息电力/水电/银行）
#   independent = 相对独立，受宏观/政策驱动而非AI情绪（创新药/消费）
#
# seesaw_partner 字段：与哪个方向形成主要跷跷板对（可选）
#
# 两市成交额水位校准（2026年新常态：日均约3万亿）：
#   < 2.5万亿 = 缩量偏冷
