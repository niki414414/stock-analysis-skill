# wave_number:   1/2/3/4，本轮行情第几波主升（null=未评估）
# wave_position: 启动/主升早/主升中/主升晚/调整（null=未评估）
# leader_stocks: 子赛道龙头代码列表（参考展示用）
# sector_20d_pct: 板块近20日涨幅%（参考展示，不参与评分）
# catalyst_quality: 超预期/事件型/纯动量（null=未评估）
# last_updated:  本子赛道数据最后更新日期

