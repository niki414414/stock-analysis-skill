  max_total_stocks: 6
  prefer_price_range: [3, 100]

  # === 战术仓/波段（2026-07-10新增，同日简化）===
  # Why: "趋势跟随+底仓持有"是2026-05-14建画像时的假设，在单边抱团行情里
  # （追高才能进场、回撤又深）这套假设本身会导致踏空或者在右侧追高被套。
  # 不是画像作废，是底仓管一部分仓位，战术仓管另一部分。
  #
  # 2026-07-10当天简化：最初给战术仓配了独立的止损基准(stop_loss_basis)，
  # 隐含"个股层面能区分趋势/震荡打法"这个假设——但同一天backtrader规范
  # 回测(5只票2年数据)显示这个假设不成立，用假设算出来的独立止损公式
  # 反而让5只里3只结果更差。已移除stop_loss_basis，止损/目标位判断
  # 现在和底仓共用同一套（六层分析里的支撑位+high_baseline），
  # 战术仓和底仓的唯一区别是仓位大小和多久回头复查一次。
  # 详见 analysis-prompt-template.md 第五层"波段方案与中线方案的关系"
  # 和记忆 project-backtest-methodology-review-20260710。
  #
  # 待办（专项时间处理，未深思熟虑前不实现）：这个仓位分配比例本身，
  # 理想情况应该由一个连续的"趋势信心刻度"决定，而不是写死12%——
  # 这个刻度怎么定义还没想清楚，先用固定值占位。
  tactical_position:
    enabled: true
    position_max_per_stock_pct: 12   # 底仓上限的一半左右，不与底仓上限混用
    holding_period_days_max: 10      # 到期后重新评估一次，不是强制平仓
    min_profit_loss_ratio: 2         # 与底仓共用同一个盈亏比标准，不单独放松

  # === 板块认知 ===
  preferred_sectors:
    - "AI算力"
    - "半导体"
    - "电力设备"
    - "创新药"
  avoid_sectors:
    - "连板妖股"
    - "次新股炒作"
    - "纯题材无业绩"

  # === 操作习惯 ===
  trading_style: "趋势跟随+底仓持有"
  use_stop_orders: true
  check_frequency: "每周2-3次"

  # === 学习目标 ===
  learning_focus_2026:
    - "板块5阶段判断"
    - "资金面分析"
    - "出货型涨停识别"
    - "角色化持仓管理"

  # === 版本与校准 ===
  profile_version: "1.1"
  profile_created: "2026-05-14"
  next_calibration_date: "2026-08-14"
